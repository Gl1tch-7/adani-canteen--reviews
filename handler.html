<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canteen Kitchen Handler — Restricted Access</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>" />
</head>
<body style="background: #18181c; color: #fff; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- ===== PASSCODE LOCK SCREEN ===== -->
  <div id="lockScreen" class="lock-screen-overlay">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2>Staff Passcode Required</h2>
      <p>This page is restricted to Adani University Canteen staff only.</p>
      
      <form id="loginForm" onsubmit="handleStaffLogin(event)" style="margin-top: 20px;">
        <div class="form-group">
          <input type="password" id="staffPasscode" class="form-input" placeholder="Enter Staff PIN (Default: 1234)" style="text-align: center; font-size: 1.2rem; letter-spacing: 4px;" required autofocus />
        </div>
        <button type="submit" class="btn-submit" style="background: var(--primary);">🔓 Unlock Dashboard</button>
      </form>
      <p id="loginError" style="color: #ff4d4d; font-size: 0.85rem; margin-top: 12px; display: none;">❌ Incorrect PIN. Access denied!</p>

      <div style="margin-top: 24px; font-size: 0.8rem; color: #888;">
        <a href="index.html" style="color: var(--primary);">← Back to Student Website</a>
      </div>
    </div>
  </div>

  <!-- ===== PROTECTED HANDLER DASHBOARD (Hidden until unlocked) ===== -->
  <div id="protectedDashboard" style="display: none; flex-direction: column; flex-grow: 1;">
    <!-- NAVBAR -->
    <nav class="navbar" style="background: #121216; border-bottom: 2px solid var(--primary);">
      <div class="nav-inner">
        <a class="nav-brand" href="index.html" style="color:#fff;">
          <div class="nav-logo" style="background: linear-gradient(135deg, #FF6B35, #FFD700);">👨‍🍳</div>
          <div class="nav-brand-text">
            <span class="uni" style="color:rgba(255,255,255,0.7);">Adani University Canteen</span>
            <span class="canteen" style="color:var(--primary);">Kitchen Order Handler</span>
          </div>
        </a>
        <div class="nav-links">
          <a href="index.html" style="color:#fff;">🎓 Student View</a>
          <button onclick="lockDashboard()" class="btn-nav" style="background:#e74c3c; cursor:pointer;">🔒 Lock Dashboard</button>
        </div>
      </div>
    </nav>

    <!-- HEADER -->
    <section style="background: #24242c; padding: 24px; text-align: center; border-bottom: 1px solid #33333d;">
      <div class="section-inner">
        <h1 style="font-size: 1.8rem; font-weight: 800; color: #fff;">👨‍🍳 Live Kitchen Order Management</h1>
        <p style="color: rgba(255,255,255,0.7); font-size: 0.95rem; margin-top: 6px;">
          Staff Portal • Authorized Personnel Only
        </p>
      </div>
    </section>

    <!-- FILTER TABS -->
    <div style="background: #1d1d24; border-bottom: 1px solid #333; padding: 12px 24px;">
      <div class="section-inner" style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <button class="handler-tab active" onclick="setHandlerFilter('All', this)">All Orders</button>
        <button class="handler-tab" onclick="setHandlerFilter('Pending', this)">⏳ Pending &amp; Preparing</button>
        <button class="handler-tab" onclick="setHandlerFilter('Ready', this)">🔔 Ready for Pickup</button>
        <button class="handler-tab" onclick="setHandlerFilter('Completed', this)">✅ Completed / Past</button>
      </div>
    </div>

    <!-- LIVE ORDERS GRID -->
    <section class="section" style="padding: 40px 24px; flex-grow: 1;">
      <div class="section-inner">
        <div class="handler-grid" id="handlerOrdersGrid">
          <!-- Generated dynamically by orders.js -->
        </div>
      </div>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
